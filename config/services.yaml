# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Types d'éléments électriques (étape 07) : code => libellé, famille, conducteurs actifs du tronçon entrant,
    # navette (va-et-vient, permutateur), hauteur par défaut (mm), dérivation, matériaux associés (catégorie du catalogue
    # + critères d'égalité). Ajouter un type ne demande ni code ni migration.
    app.electricite.types:
        tableau:
            libelle: 'Distribution board'
            famille: distribution
            hauteur: 1800
        boite_derivation:
            libelle: 'Junction box'
            famille: distribution
            hauteur: 2200
            derivation: true
            boite: { categorie: electrique_boite }
            connecteur: { categorie: electrique_connecteur, criteres: { type: wago } }
        interrupteur:
            libelle: 'Switch'
            famille: commande
            hauteur: 1100
            boite: { categorie: electrique_boite }
            mecanisme: { categorie: electrique_appareillage, criteres: { fonction: interrupteur } }
            plaque: { categorie: electrique_appareillage, criteres: { fonction: plaque } }
        va_et_vient:
            libelle: 'Two-way switch'
            famille: commande
            navette: true
            hauteur: 1100
            boite: { categorie: electrique_boite }
            mecanisme: { categorie: electrique_appareillage, criteres: { fonction: va_et_vient } }
            plaque: { categorie: electrique_appareillage, criteres: { fonction: plaque } }
        permutateur:
            libelle: 'Intermediate switch'
            famille: commande
            navette: true
            hauteur: 1100
            boite: { categorie: electrique_boite }
            mecanisme: { categorie: electrique_appareillage, criteres: { fonction: permutateur } }
            plaque: { categorie: electrique_appareillage, criteres: { fonction: plaque } }
        prise:
            libelle: 'Socket outlet'
            famille: prise
            hauteur: 300
            boite: { categorie: electrique_boite }
            mecanisme: { categorie: electrique_appareillage, criteres: { fonction: prise } }
            plaque: { categorie: electrique_appareillage, criteres: { fonction: plaque } }
        prise_specialisee:
            libelle: 'Dedicated outlet'
            famille: prise
            hauteur: 1100
            boite: { categorie: electrique_boite }
            mecanisme: { categorie: electrique_appareillage, criteres: { fonction: prise_specialisee } }
            plaque: { categorie: electrique_appareillage, criteres: { fonction: plaque } }
        point_lumineux:
            libelle: 'Light point'
            famille: luminaire
            hauteur: 2500
            boite: { categorie: electrique_boite }
        applique:
            libelle: 'Wall light'
            famille: luminaire
            hauteur: 1800
            boite: { categorie: electrique_boite }
        radiateur:
            libelle: 'Heater'
            famille: charge
            hauteur: 1800
            boite: { categorie: electrique_boite }

    # Types d'équipements des familles autres que l'électricité (étape 08) : famille => code => libellé (clé de
    # traduction). Les types électriques viennent de `app.electricite.types`.
    app.reseaux.types:
        plomberie: {}
        ventilation: {}

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    _instanceof:
        App\Catalogue\CategorieMateriau:
            tags: ['app.categorie_materiau']
        App\Calcul\Systeme\DefinitionSysteme:
            tags: ['app.definition_systeme']
        App\Calcul\Couche\CalculateurCouche:
            tags: ['app.calculateur_couche']

    App\Catalogue\RegistreCategories:
        arguments:
            $categories: !tagged_iterator app.categorie_materiau

    App\Calcul\Systeme\RegistreSystemes:
        public: true
        arguments:
            $definitions: !tagged_iterator app.definition_systeme

    App\Calcul\Couche\RegistreCalculateurs:
        public: true
        arguments:
            $calculateurs: !tagged_iterator app.calculateur_couche

    App\Calcul\Electricite\RegistreTypesElements:
        public: true
        arguments:
            $definitions: '%app.electricite.types%'

    App\Service\TypesEquipement:
        public: true
        arguments:
            $autres: '%app.reseaux.types%'

    App\Calcul\Materiau\SpecificationSerialiseur:
        public: true

    App\Service\CalculSysteme:
        public: true

    App\Service\ServiceVariantes:
        public: true

    App\Calcul\Materiau\SourceCandidats: '@App\Repository\MateriauRepository'

when@test:
    services:
        # Le bloc when@ est chargé à part : les _instanceof ci-dessus ne s'y appliquent pas.
        _instanceof:
            App\Calcul\Systeme\DefinitionSysteme:
                tags: ['app.definition_systeme']
            App\Calcul\Couche\CalculateurCouche:
                tags: ['app.calculateur_couche']

        # Systèmes et calculateurs de test (aucun système concret de 05b/05c) : seul le tag les enregistre.
        App\Tests\Calcul\Systemes\:
            resource: '../tests/Calcul/Systemes/'
            autowire: true
            autoconfigure: true
