# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    _instanceof:
        App\Catalogue\CategorieMateriau:
            tags: ['app.categorie_materiau']
        App\Calcul\Systeme\DefinitionSysteme:
            tags: ['app.definition_systeme']
        App\Calcul\Couche\CalculateurCouche:
            tags: ['app.calculateur_couche']

    App\Catalogue\RegistreCategories:
        arguments:
            $categories: !tagged_iterator app.categorie_materiau

    App\Calcul\Systeme\RegistreSystemes:
        public: true
        arguments:
            $definitions: !tagged_iterator app.definition_systeme

    App\Calcul\Couche\RegistreCalculateurs:
        public: true
        arguments:
            $calculateurs: !tagged_iterator app.calculateur_couche

    App\Calcul\Materiau\SpecificationSerialiseur:
        public: true

    App\Service\CalculSysteme:
        public: true

    App\Calcul\Materiau\SourceCandidats: '@App\Repository\MateriauRepository'

when@test:
    services:
        # Le bloc when@ est chargé à part : les _instanceof ci-dessus ne s'y appliquent pas.
        _instanceof:
            App\Calcul\Systeme\DefinitionSysteme:
                tags: ['app.definition_systeme']
            App\Calcul\Couche\CalculateurCouche:
                tags: ['app.calculateur_couche']

        # Systèmes et calculateurs de test (aucun système concret de 05b/05c) : seul le tag les enregistre.
        App\Tests\Calcul\Systemes\:
            resource: '../tests/Calcul/Systemes/'
            autowire: true
            autoconfigure: true
