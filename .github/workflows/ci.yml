name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, pdo_mysql
      - name: Install Symfony CLI
        run: |
          curl -sS https://get.symfony.com/cli/installer | bash
          echo "$HOME/.symfony5/bin" >> "$GITHUB_PATH"
      - run: symfony composer install --no-interaction --no-progress --prefer-dist
      - run: symfony console cache:warmup --env=dev
      - run: symfony php vendor/bin/phpstan analyse --no-progress

  phpunit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://app:ChangeMe@127.0.0.1:3306/app?serverVersion=11.4.0-MariaDB&charset=utf8mb4
    services:
      database:
        image: mariadb:11.4
        env:
          # Le suffixe _test de l'env test donne app_test : MariaDB la crée et donne les droits à `app`
          MARIADB_DATABASE: app_test
          MARIADB_USER: app
          MARIADB_PASSWORD: ChangeMe
          MARIADB_ROOT_PASSWORD: ChangeMeRoot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, pdo_mysql
      - name: Install Symfony CLI
        run: |
          curl -sS https://get.symfony.com/cli/installer | bash
          echo "$HOME/.symfony5/bin" >> "$GITHUB_PATH"
      - run: symfony composer install --no-interaction --no-progress --prefer-dist
      - run: symfony console importmap:install
      - run: symfony php vendor/bin/phpunit
